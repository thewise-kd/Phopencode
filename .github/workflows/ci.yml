name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  jvm:
    runs-on: ubuntu-24.04
    # functionalTest took about 30 minutes cold on the Pi.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: gradle/verify-wrapper.sh --online
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The MIT provider; the default one is a proprietary library.
          cache-provider: basic
      # The runner image presets both variables, and this job proves the build without an SDK.
      - run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT
          ./gradlew jvmCheck functionalTest

  helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # helper/tests arrives in P11. Tests can import notifyd or helper.notifyd.
      # Once the directory exists, a run that finds no tests fails on Python 3.12+.
      - env:
          PYTHONPATH: helper
        run: |
          if [ ! -d helper/tests ]; then
            echo "helper/tests does not exist yet, nothing to run"
            exit 0
          fi
          python3 -m unittest discover -s helper/tests

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: gradle/verify-wrapper.sh --online
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Space separated on one line: the action does not split on newlines.
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      # gradle.properties holds the small heaps of the Pi; the command line wins over it.
      - run: |
          ./gradlew testDebugUnitTest assembleDebug lint \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs=-Xmx3g

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_strings.py
      - run: python3 scripts/check_boundaries.py
      - run: python3 -m unittest discover -s scripts/tests
