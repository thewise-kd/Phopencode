name: Release

# P12.5: a pushed v* tag builds the release APK, signs it with the key from the repository's
# secrets, and attaches the APK and its SHA-256 to the GitHub Release of that tag. The user creates
# the tag (docs/dev-setup/release.md); this workflow never creates or moves tags.
#
# Only a tag push starts it, never a pull request, so a fork's code never runs with the secrets.
on:
  push:
    tags:
      - "v*"

permissions: {}

# Two pushes of the same tag must not race each other to the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Builds and signs with a read-only token. The signing secrets reach only the steps that need
  # them, never Gradle, and the job cannot write to the repository.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BUILD_TOOLS: "36.0.0"
      # Expressions reach the scripts through env only; a tag name is not trusted shell text.
      TAG: ${{ github.ref_name }}
    steps:
      # A tag the workflow does not understand fails before anything is built.
      - name: Check the tag
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not of the form v<major>.<minor>.<patch>[-<suffix>]" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: gradle/verify-wrapper.sh --online
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Space separated on one line: the action does not split on newlines.
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      # No cache: a release is built from a clean state, and nothing it writes is reused.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-disabled: true

      # app/build.gradle.kts gives release no signing config (P12.4), so this is the unsigned APK.
      - name: Build the release APK
        run: |
          ./gradlew :app:assembleRelease \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs=-Xmx3g

      # The tag names the version the app reports; versionName is set in app/build.gradle.kts.
      - name: Find the APK and check its version against the tag
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/Phopencode-release*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one Phopencode-release*.apk, found ${#apks[@]}" >&2
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          version="$("$tools/aapt2" dump badging "${apks[0]}" \
            | sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the app's versionName '$version'" >&2
            exit 1
          fi
          {
            echo "UNSIGNED_APK=${apks[0]}"
            echo "TOOLS=$tools"
            echo "OUT=$RUNNER_TEMP/release-out"
            echo "APK_NAME=Phopencode-$TAG.apk"
          } >> "$GITHUB_ENV"

      # zipalign before apksigner: signing with v2+ covers the whole file, so any later change
      # breaks the signature. -P 16 page-aligns native libraries for 16 KB page devices.
      - name: Align the APK
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          "$TOOLS/zipalign" -f -P 16 4 "$UNSIGNED_APK" "$RUNNER_TEMP/aligned.apk"

      # The secrets arrive as env values only. The keystore is decoded by builtins and a pipe, so
      # it is never on any command line, and the passwords reach apksigner as env: references.
      - name: Sign the APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::The repository secret $name is not set; see docs/dev-setup/release.md" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 decodes to an empty file" >&2
            exit 1
          fi

          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$OUT/$APK_NAME" \
            "$RUNNER_TEMP/aligned.apk"

      # Runs whatever happened before, including a cancelled run.
      - name: Remove the keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.jks"

      # The signature checks out, alignment survived signing, and the signer is not a debug key.
      - name: Verify the signed APK
        run: |
          set -euo pipefail
          apk="$OUT/$APK_NAME"
          "$TOOLS/zipalign" -c -P 16 4 "$apk"
          certs="$("$TOOLS/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$certs"
          if grep -q 'CN=Android Debug' <<< "$certs"; then
            echo "::error::The APK is signed with a debug key" >&2
            exit 1
          fi

      # sha256sum format, with the bare file name, so `sha256sum -c` works next to the download.
      - name: Compute the SHA-256
        run: |
          set -euo pipefail
          cd "$OUT"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: |
            ${{ runner.temp }}/release-out/*.apk
            ${{ runner.temp }}/release-out/*.apk.sha256
          retention-days: 1
          if-no-files-found: error

  # The only job that can write, and it sees no signing secret: it publishes what build made.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: release-out

      # Creates the release of the pushed tag, or adds to it when it already exists. A tag with
      # a suffix (v1.2.3-rc.1) becomes a pre-release.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=(release-out/*.apk release-out/*.apk.sha256)
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing release file $file" >&2
              exit 1
            fi
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${files[@]}"
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
              "${prerelease[@]}" "${files[@]}"
          fi
