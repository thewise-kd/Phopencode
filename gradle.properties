# Limits for the Pi: 4 cores and 7.6 GB, shared by up to 4 Gradle runs in one
# parallel group (see "Parallel work rules" in docs/PHASES.md). Android builds in CI
# need more and pass a larger heap with -Dorg.gradle.jvmargs on the command line.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.workers.max=2
org.gradle.parallel=true

# The build cache is shared by all worktrees, so a parallel task reuses their work.
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
