# The one place for versions. See "Technology choices" in docs/PHASES.md.
# Later tasks do not edit this file: a new dependency is a task of its own.

[versions]
# Build. `gradle` is not referenced below: it records the wrapper version, and a
# test keeps the two equal.
gradle = "9.8.2"
agp = "9.5.0"
kotlin = "2.4.21"

# Android SDK levels, read by the convention plugins in build-logic.
# compileSdk is the floor set by androidx.core 1.19 and navigation 2.10.
android-minSdk = "26"
android-compileSdk = "37"
android-targetSdk = "37"

# Runtime
compose-bom = "2026.09.00"
navigation = "2.10.2"
koin = "4.2.2"
sshj = "0.41.2"
# The version sshj 0.41.2 itself is built against.
bouncycastle = "1.84"
okhttp = "5.5.1"
serialization = "1.12.0"
coroutines = "1.11.0"
tink = "1.24.0"
datastore = "1.3.0"
markdown-renderer = "0.46.0"
highlights = "1.1.0"
sora-editor = "0.24.7"
coil = "3.6.3"
activity = "1.13.0"
appcompat = "1.8.0"
core-ktx = "1.19.1"
core-splashscreen = "1.2.0"
lifecycle = "2.11.0"
slf4j = "2.0.20"

# Fallback if sshj fails on Android in P3.10. Not used by any module.
jsch = "2.28.8"

# Tests
junit5 = "6.1.3"
junit4 = "4.13.2"
mina-sshd = "2.20.1"
turbine = "1.2.1"
robolectric = "4.17"
androidx-test = "1.7.0"
androidx-test-ext-junit = "1.3.0"
espresso = "3.7.0"

[libraries]
# Build plugins, for build-logic's classpath.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# Kotlin
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Network
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# Dependency injection
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Compose, versions from the BOM.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Encrypted storage
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }

# Content
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }
markdown-renderer-code = { module = "com.mikepenz:multiplatform-markdown-renderer-code", version.ref = "markdown-renderer" }
highlights = { module = "dev.snipme:highlights", version.ref = "highlights" }
sora-editor = { module = "io.github.rosemoe:editor", version.ref = "sora-editor" }
sora-editor-language-textmate = { module = "io.github.rosemoe:language-textmate", version.ref = "sora-editor" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

# JVM tests
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
okhttp-mockwebserver3-junit5 = { module = "com.squareup.okhttp3:mockwebserver3-junit5", version.ref = "okhttp" }
mina-sshd-core = { module = "org.apache.sshd:sshd-core", version.ref = "mina-sshd" }
mina-sshd-sftp = { module = "org.apache.sshd:sshd-sftp", version.ref = "mina-sshd" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-test-junit4 = { module = "io.insert-koin:koin-test-junit4", version.ref = "koin" }

# Android tests
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
# Modules apply the phopencode.* convention plugins, not these. These plugins are
# on build-logic's classpath, so an alias here is for reference and for build-logic
# itself; `alias(...)` with a version in a module fails with "already on the classpath".
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
